name: Publish verified wide.39 downloads
on:
  push:
    branches: [main]
    paths:
      - 'release/wide39/**'
      - '.github/workflows/release-wide39.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-wide39
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install binary patch reader
        run: python -m pip install bsdiff4==1.4.2
      - name: Restore and hash-check signed APK; archive matching sources
        run: python release/wide39/publish.py
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view wide.39 >/dev/null 2>&1; then
            echo 'wide.39 already exists; refusing to replace release assets automatically.'
            exit 1
          fi
          gh release create wide.39 release-output/* \
            --target "$GITHUB_SHA" \
            --title 'Copilot tw wide.39（測試版）' \
            --notes-file release/wide39/NOTES.md \
            --latest
