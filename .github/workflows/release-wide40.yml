name: Publish verified wide.40 downloads
on:
  push:
    branches: [main]
    paths:
      - 'release/wide40/**'
      - '.github/workflows/release-wide40.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-wide40
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install binary patch reader
        run: python -m pip install bsdiff4==1.4.2
      - name: Restore and hash-check signed APK; archive matching sources
        run: python release/wide40/publish.py
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view wide.40 >/dev/null 2>&1; then
            echo 'wide.40 already exists; refusing to replace release assets automatically.'
            exit 1
          fi
          gh release create wide.40 release-output/* \
            --target "$GITHUB_SHA" \
            --title 'Copilot tw wide.40（測試版）' \
            --notes-file release/wide40/NOTES.md \
            --latest
