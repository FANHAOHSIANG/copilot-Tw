name: CoPilot host checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the UI check's Traditional Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Run the production host checks with verified dependencies
        run: python3 .github/scripts/run_host_checks.py --output-dir "${RUNNER_TEMP}/copilot-host-checks"

      - name: Save this run's reports and host UI previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-host-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/copilot-host-checks/
          if-no-files-found: warn
          retention-days: 14
